<text x="544" y="25" fill="#d9ffe2" font-size="16" font-family="monospace"><tspan x="544" y="25" fill="#00ff41">andres@arch</tspan><tspan fill="#00cc33"> ─────────────────────────────</tspan><tspan x="544" y="55" fill="#00cc33">.</tspan><tspan fill="#00ff41">OS</tspan><tspan fill="#00cc33">: </tspan><tspan fill="#d9ffe2">Arch Linux + Hyprland</tspan><tspan x="544" y="79" fill="#00cc33">.</tspan><tspan fill="#00ff41">WM</tspan><tspan fill="#00cc33">: </tspan><tspan fill="#d9ffe2">Hyprland (Wayland)</tspan><tspan x="544" y="103" fill="#00cc33">.</tspan><tspan fill="#00ff41">Shell</tspan><tspan fill="#00cc33">: </tspan><tspan fill="#d9ffe2">bash/zsh</tspan><tspan x="544" y="127" fill="#00cc33">.</tspan><tspan fill="#00ff41">Rol</tspan><tspan fill="#00cc33">: </tspan><tspan fill="#d9ffe2">Ing. Sistemas — EAN, Bogotá</tspan><tspan x="544" y="151" fill="#00cc33">.</tspan><tspan fill="#00ff41">Inglés</tspan><tspan fill="#00cc33">: </tspan><tspan fill="#d9ffe2">B2</tspan><tspan x="544" y="175" fill="#00cc33">.</tspan><tspan fill="#00ff41">Lenguajes</tspan><tspan fill="#00cc33">: </tspan><tspan fill="#d9ffe2">Python · TypeScript · C++ · Bash</tspan><tspan x="544" y="199" fill="#00cc33">.</tspan><tspan fill="#00ff41">IA/ML</tspan><tspan fill="#00cc33">: </tspan><tspan fill="#d9ffe2">Whisper · CLIP · OCR · InsightFace</tspan><tspan x="544" y="223" fill="#00cc33">.</tspan><tspan fill="#00ff41">Backend</tspan><tspan fill="#00cc33">: </tspan><tspan fill="#d9ffe2">FastAPI · SQLAlchemy</tspan><tspan x="544" y="247" fill="#00cc33">.</tspan><tspan fill="#00ff41">Frontend</tspan><tspan fill="#00cc33">: </tspan><tspan fill="#d9ffe2">React · Vite · Tailwind</tspan><tspan x="544" y="271" fill="#00cc33">.</tspan><tspan fill="#00ff41">DevOps</tspan><tspan fill="#00cc33">: </tspan><tspan fill="#d9ffe2">Docker · systemd · GitHub Actions</tspan><tspan x="544" y="295" fill="#00cc33">.</tspan><tspan fill="#00ff41">Hardware</tspan><tspan fill="#00cc33">: </tspan><tspan fill="#d9ffe2">Arduino · u