name: README build

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate unified profile SVG
        env:
          USER_NAME: AndresBlancoSierra
          GITHUB_TOKEN: ${{ github.token }}
        run: python generate_readme.py

      - name: Generate contribution snake (grayscale)
        uses: Platane/snk@v3
        with:
          github_user_name: AndresBlancoSierra
          outputs: |
            dist/github-snake.svg?color_snake=%23f4f4f5&color_dots=%23050505,%2318181b,%2352525b,%23a1a1aa,%23f4f4f5
            dist/github-snake-dark.svg?color_snake=%23f4f4f5&color_dots=%23050505,%2318181b,%2352525b,%23a1a1aa,%23f4f4f5

      - name: Commit changes
        run: |
          git add profile.svg dist/github-snake.svg dist/github-snake-dark.svg
          git diff --quiet && git diff --cached --quiet && echo "Sin cambios" || (
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Actualizar stats del perfil"
            git push
          )